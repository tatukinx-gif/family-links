<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Links 検証環境</title>
<style>
  :root { color-scheme: dark light; font: 16px system-ui; }
  body { margin: 0; }
  header { padding: 12px 16px; background: #142b4c; color: white; }
  h1 { margin: 0; font-size: 1.25rem; }
  main { max-width: 62rem; margin: auto; padding: 12px; }
  button { min-height: 44px; margin: 2px; }
  #grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
  .link-card { display: block; overflow: hidden; padding: 50px 6px 12px; text-overflow: ellipsis; white-space: nowrap; text-align: center; border: 1px solid GrayText; border-radius: 8px; }
  dialog { max-width: min(28rem, 80vw); }
</style>
<header><h1>Family Links 検証環境</h1></header>
<main>
  <section id="registration" aria-label="端末登録">
    <p id="setup" role="status">検証用APIは未設定です。</p>
  </section>
  <nav id="filters" aria-label="利用者"></nav>
  <section id="grid" aria-label="リンク一覧"></section>
</main>
<script type="module">
  import { mountFamilyLinksStaging } from './family-links-staging-ui.js';
  // Set the test deployment URL before publishing this page.
  const endpoint = 'https://script.google.com/macros/s/AKfycbyC9B0Id9bePT6z15KvGWg9qkvykKWvCgm6cgKPMvDhLoltyS9vjxJu8gArWkg1QFfJzg/exec';
  if (endpoint) {
    const byId = id => document.getElementById(id);
    mountFamilyLinksStaging({
      endpoint, registration: byId('registration'),
      grid: byId('grid'), filters: byId('filters')
    });
  }
</script>
</html>
